; PlatformIO — R53 Shift Light + Wideband BLE Bridge (one ESP32)
; Board: Waveshare ESP32-S3-Zero (ESP32-S3FH4R2, 4 MB flash / 2 MB quad PSRAM).
;
; No Waveshare board def in mainline platform-espressif32, so this builds as a
; generic S3 DevKitC with the chip's real memory config forced: 4 MB flash (the
; devkitc default is 8 MB — its partition table would not fit) and QSPI PSRAM
; (the OPI default hangs on boot with this chip's quad PSRAM).
;
; The S3-Zero has NO USB-UART bridge — serial only exists over the native USB-C
; port, hence ARDUINO_USB_CDC_ON_BOOT. First flash on a blank/crashed board:
; hold BOOT while plugging in USB, flash, then press RESET.
;
; RPM comes from the car's CAN bus (TWAI, listen-only) and the wideband goes
; out over BLE — no WiFi, so BLE has the radio to itself.

[env:esp32s3zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
; NimBLE 2.x matches arduino-esp32 3.x (S3). 1.4.x panics on BT init.
; FastLED 3.7+ has RMT5 support for the S3 on the 3.x core.
lib_deps =
    fastled/FastLED@^3.7.0
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
