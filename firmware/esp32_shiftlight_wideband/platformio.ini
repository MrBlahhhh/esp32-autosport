; PlatformIO — shift light + wideband BLE bridge + microSD logger
; Board: this project's ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM).
;
; Derived from the R53 build in firmware/vendor/r53_shiftlight_wideband, which
; targets a Waveshare ESP32-S3-Zero. Three things differ and all three are the
; module, not the code:
;
;   flash    16 MB here, 4 MB there — the devkitc default partition table fits
;   PSRAM    opi_opi: this module has OCTAL PSRAM. The R53 build forces
;            qio_qspi because the S3FH4R2's quad PSRAM hangs on boot with the
;            OPI default. Getting this backwards hangs the board at boot in
;            exactly the same way, in the other direction.
;   USB      the WROOM-1 has no USB-UART bridge either, so serial is still
;            native USB-CDC.
;
; GPIO35–37 are consumed by the octal PSRAM and are unavailable as IO. See
; README section 6.

[env:esp32s3_autosport]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
; NimBLE 2.x matches arduino-esp32 3.x (S3). 1.4.x panics on BT init.
; FastLED 3.7+ has RMT5 support for the S3 on the 3.x core.
lib_deps =
    fastled/FastLED@^3.7.0
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DBOARD_HAS_PSRAM
